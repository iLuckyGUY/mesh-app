name: mesh-app Docker

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build & push (branch, tag, or SHA). Leave empty for default.'
        required: false
        default: ''

env:
  DH_IMAGE: iluckyguy/mesh-app
  DH_NAMESPACE: iluckyguy
  DH_REPO: mesh-app
  KEEP_VERSIONS: 2   # latest + N-1 previous version tags kept on Docker Hub

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/lint.yml

  build-and-push:
    needs: [lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: "Build and push Docker image (multi-arch: amd64+arm64)"
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_TELEGRAM_BOT_USERNAME=
            VITE_APP_NAME=Cabinet
            VITE_APP_LOGO=V

      - name: Prune old Docker Hub version tags
        # Skip pruning on a manual rebuild-from-old-ref dispatch: we don't
        # want rebuilding an old version to accidentally delete the newer
        # ones that are actually in production.
        if: github.event_name != 'workflow_dispatch'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          CURRENT_VERSION: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_PASSWORD}\"}" \
            | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::warning::Could not authenticate to Docker Hub API, skipping tag prune"
            exit 0
          fi

          # Poll (up to 60s) until the tag we just pushed is visible, so we
          # never prune against a list that's missing the current release.
          TAGS_JSON=""
          for i in $(seq 1 12); do
            TAGS_JSON=$(curl -s -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${DH_NAMESPACE}/${DH_REPO}/tags/?page_size=100")
            if echo "$TAGS_JSON" | jq -e --arg v "$CURRENT_VERSION" '.results[] | select(.name == $v)' >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for ${CURRENT_VERSION} to appear in Docker Hub tag list ($i/12)..."
            sleep 5
          done

          ALL_TAGS=$(echo "$TAGS_JSON" | jq -r '.results[].name')

          # Rank purely by semver (strip a leading 'v'), NOT by Docker Hub's
          # last_updated - that field lags/reorders unpredictably right after
          # a push and previously caused the wrong tag to be pruned.
          VERSION_TAGS_SORTED=$(echo "$ALL_TAGS" \
            | grep -v '^latest$' \
            | sed 's/^v//' \
            | sort -Vr \
            | sed 's/^/v/')

          KEEP=$(echo "$VERSION_TAGS_SORTED" | head -n "${KEEP_VERSIONS}")
          DELETE=$(echo "$VERSION_TAGS_SORTED" | tail -n +"$(( KEEP_VERSIONS + 1 ))")

          # Map back to the exact tag name as it exists on Docker Hub (some
          # older tags in this repo were pushed without the 'v' prefix).
          resolve_tag() {
            local candidate="$1"
            if echo "$ALL_TAGS" | grep -qx "$candidate"; then
              echo "$candidate"
            else
              echo "${candidate#v}"
            fi
          }

          echo "Keeping: $(for t in $KEEP; do resolve_tag "$t"; done | tr '\n' ' ')"

          if [ -z "$DELETE" ]; then
            echo "Nothing to prune."
            exit 0
          fi

          for t in $DELETE; do
            tag=$(resolve_tag "$t")
            echo "Deleting old tag: ${tag}"
            curl -s -o /dev/null -w "  -> HTTP %{http_code}\n" -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${DH_NAMESPACE}/${DH_REPO}/tags/${tag}/"
          done
